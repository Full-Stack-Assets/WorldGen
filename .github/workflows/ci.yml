name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify provider-neutral tracked state
        shell: python
        run: |
          from pathlib import Path
          import sys

          retired = "ver" + "cel"
          ignored = {".git", "node_modules", "dist", "coverage"}
          hits = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore").lower()
              except OSError:
                  continue
              if retired in text:
                  hits.append(str(path))

          if hits:
              print("Retired provider reference found in tracked source:")
              for hit in sorted(hits):
                  print(f" - {hit}")
              sys.exit(1)

          print("Provider-neutral repository check passed.")

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify backend server syntax
        run: node --check server.mjs

      - name: Verify backend persistence boundary
        shell: python
        run: |
          from pathlib import Path
          import sys

          text = Path("server.mjs").read_text(encoding="utf-8")
          required = [
              "SUPABASE_BACKEND_TOKEN",
              "worldline_backend_gateway",
              "gatewayRequest('health')",
              "gatewayRequest('list_projects')",
              "gatewayRequest('sync_project'",
              "gatewayRequest('delete_project'",
          ]
          forbidden = [
              "worldline_projects?",
              "worldline_interventions?",
              "worldline_experiments?",
          ]

          missing = [item for item in required if item not in text]
          direct = [item for item in forbidden if item in text]

          if missing or direct:
              if missing:
                  print("Missing backend gateway contract markers:", missing)
              if direct:
                  print("Direct database table REST access reintroduced:", direct)
              sys.exit(1)

          print("Backend persistence boundary check passed.")

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
